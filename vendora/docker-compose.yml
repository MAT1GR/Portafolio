# Levanta Postgres + la app + el worker de tareas periódicas.
# Uso: cp .env.example .env (completá secretos) && docker compose up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vendora
      POSTGRES_PASSWORD: vendora
      POSTGRES_DB: vendora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendora"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vendora:vendora@db:5432/vendora
      LOCAL_STORAGE_DIR: /data/storage
    ports:
      - "3000:3000"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
  worker:
    image: node:22-bookworm-slim
    command: ["node", "-e", "const u=(process.env.APP_URL_INTERNAL||'http://app:3000')+'/api/cron';setInterval(()=>fetch(u,{headers:{Authorization:'Bearer '+process.env.CRON_SECRET}}).then(r=>r.text()).then(t=>console.log(new Date().toISOString(),t.slice(0,200))).catch(e=>console.error(e.message)),60000)"]
    env_file: .env
    environment:
      APP_URL_INTERNAL: http://app:3000
    depends_on:
      - app
  # Datos iniciales (planes, admin y tienda demo). Se corre una vez: docker compose run --rm seed
  seed:
    build:
      context: .
      target: build
    profiles: ["seed"]
    command: ["npx", "tsx", "prisma/seed.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vendora:vendora@db:5432/vendora
      LOCAL_STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  storage:
